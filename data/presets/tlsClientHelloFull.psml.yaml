# yaml-language-server: $schema=../../schemas/psml.schema.json
name: TLS ClientHello (full)
rowBits: 32
byteOrder: BE
description: TLS 1.3 ClientHello (RFC 8446 §4.1.2) with a populated Extensions catalog (SNI / supported_versions / supported_groups / key_share / ALPN) and the server-side encrypted handshake records modeled as an Encrypted container.
body:
  - id: msgType
    name: Handshake Type
    type:
      kind: bits
      n: 8
    category: type
    defaultValue: 1
    doc: 1 = ClientHello. [RFC 8446 §4]
  - id: length
    name: Handshake Length
    type:
      kind: bits
      n: 24
    category: length
    doc: Length of the handshake message body that follows. [RFC 8446 §4]
  - id: legacyVersion
    name: legacy_version
    type:
      kind: bits
      n: 16
    category: type
    doc: Frozen at 0x0303 (TLS 1.2) for middlebox compatibility. [RFC 8446 §4.1.2]
  - id: random
    name: random
    type:
      kind: bits
      n: 256
    category: identifier
    doc: 32 cryptographically random bytes. [RFC 8446 §4.1.2]
  - id: sessionIdLen
    name: session_id length
    type:
      kind: bits
      n: 8
    category: length
  - id: sessionId
    name: session_id
    type:
      kind: bits
      n: 256
    category: identifier
  - id: cipherSuitesLen
    name: cipher_suites length
    type:
      kind: bits
      n: 16
    category: length
  - id: cipherSuites
    name: cipher_suites
    type:
      kind: bits
      n: 32
    category: type
  - id: compMethodsLen
    name: compression length
    type:
      kind: bits
      n: 8
    category: length
  - id: compMethods
    name: compression_methods
    type:
      kind: bits
      n: 8
    category: reserved
  - id: extensionsLen
    name: extensions length
    type:
      kind: bits
      n: 16
    category: length
    defaultValue: 0
    doc: Total length in bytes of the extensions block that follows.
  - kind: repeat
    id: extensions
    name: Extensions
    category: variable
    element:
      id: extensionRecord
      fields:
        - kind: switch
          id: byKind
          on:
            kind: ref
            field: extensions_kind
          cases:
            "0":
              id: sni
              fields:
                - id: type
                  name: Type=0
                  type:
                    kind: bits
                    n: 16
                  category: type
                - id: length
                  name: Ext Len
                  type:
                    kind: bits
                    n: 16
                  category: length
                - id: listLen
                  name: List Len
                  type:
                    kind: bits
                    n: 16
                  category: length
                - id: nameType
                  name: Name Type=0
                  type:
                    kind: bits
                    n: 8
                  category: type
                - id: nameLen
                  name: Name Len
                  type:
                    kind: bits
                    n: 16
                  category: length
                - id: hostname
                  name: host_name (var)
                  type:
                    kind: bits
                    n: 96
                  category: addressing
            "10":
              id: supportedGroups
              fields:
                - id: type
                  name: Type=10
                  type:
                    kind: bits
                    n: 16
                  category: type
                - id: length
                  name: Ext Len
                  type:
                    kind: bits
                    n: 16
                  category: length
                - id: listLen
                  name: List Len
                  type:
                    kind: bits
                    n: 16
                  category: length
                - id: groups
                  name: named_group_list
                  type:
                    kind: bits
                    n: 32
                  category: type
            "16":
              id: alpn
              fields:
                - id: type
                  name: Type=16
                  type:
                    kind: bits
                    n: 16
                  category: type
                - id: length
                  name: Ext Len
                  type:
                    kind: bits
                    n: 16
                  category: length
                - id: listLen
                  name: Proto List Len
                  type:
                    kind: bits
                    n: 16
                  category: length
                - id: protoLen
                  name: Proto Len
                  type:
                    kind: bits
                    n: 8
                  category: length
                - id: protocol
                  name: protocol (var)
                  type:
                    kind: bits
                    n: 16
                  category: type
            "43":
              id: supportedVersions
              fields:
                - id: type
                  name: Type=43
                  type:
                    kind: bits
                    n: 16
                  category: type
                - id: length
                  name: Ext Len
                  type:
                    kind: bits
                    n: 16
                  category: length
                - id: vListLen
                  name: Versions Len
                  type:
                    kind: bits
                    n: 8
                  category: length
                - id: versions
                  name: versions
                  type:
                    kind: bits
                    n: 16
                  category: type
            "51":
              id: keyShare
              fields:
                - id: type
                  name: Type=51
                  type:
                    kind: bits
                    n: 16
                  category: type
                - id: length
                  name: Ext Len
                  type:
                    kind: bits
                    n: 16
                  category: length
                - id: listLen
                  name: Shares Len
                  type:
                    kind: bits
                    n: 16
                  category: length
                - id: group
                  name: group
                  type:
                    kind: bits
                    n: 16
                  category: type
                - id: keyLen
                  name: key Len
                  type:
                    kind: bits
                    n: 16
                  category: length
                - id: key
                  name: key_exchange (X25519, 32B)
                  type:
                    kind: bits
                    n: 256
                  category: identifier
    count:
      kind: ref
      field: tlsClientHelloFull_extensions_count
  - kind: encrypted
    id: serverHandshake
    name: Server Handshake (encrypted)
    contextNote: Encrypted handshake — requires TLS 1.3 key schedule outputs (handshake traffic keys derived from ECDHE).
    wireBits:
      kind: lit
      value: 384
    category: payload-marker
    plaintext:
      id: serverHandshakePlaintext
      fields:
        - id: sh_msgType
          name: ServerHello Type=2
          type:
            kind: bits
            n: 8
          category: type
          doc: ServerHello handshake message type. [RFC 8446 §4.1.3]
        - id: sh_length
          name: Handshake Length
          type:
            kind: bits
            n: 24
          category: length
        - id: sh_legacyVersion
          name: legacy_version
          type:
            kind: bits
            n: 16
          category: type
        - id: sh_random
          name: random
          type:
            kind: bits
            n: 256
          category: identifier
        - id: ee_msgType
          name: EncryptedExtensions Type=8
          type:
            kind: bits
            n: 8
          category: type
          doc: EncryptedExtensions handshake message type. [RFC 8446 §4.3.1]
        - id: ee_body
          name: EncryptedExtensions Body
          type:
            kind: bits
            n: 64
          category: variable
        - id: fin_msgType
          name: Finished Type=20
          type:
            kind: bits
            n: 8
          category: type
          doc: Finished handshake message type. [RFC 8446 §4.4.4]
        - id: fin_verifyData
          name: verify_data
          type:
            kind: bits
            n: 48
          category: checksum
