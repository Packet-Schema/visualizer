# yaml-language-server: $schema=../../schemas/psml.schema.json
name: HTTP/2 Frame Header
rowBits: 32
byteOrder: BE
description: HTTP/2 frame header (RFC 9113 §4.1). 9-byte fixed prefix (Length:24 + Type:8 + Flags:8 + R:1 + Stream Identifier:31) followed by a length-prefixed payload.
body:
  - id: length
    name: Length
    type:
      kind: bits
      n: 24
    category: length
    defaultValue: 0
  - id: type
    name: Type
    type:
      kind: bits
      n: 8
    category: type
  - id: flags
    name: Flags
    type:
      kind: bits
      n: 8
    category: flags
  - id: r
    name: R
    type:
      kind: bits
      n: 1
    category: reserved
  - id: streamId
    name: Stream Identifier
    type:
      kind: bits
      n: 31
    category: identifier
  - id: payload
    name: Payload
    type:
      kind: bytes
      n:
        kind: ref
        field: length
    category: payload-marker
    doc: Frame payload — length bytes. [RFC 9113 §4.1]
constraints:
  - lhs:
      kind: op
      op: "*"
      a:
        kind: ref
        field: length
      b:
        kind: lit
        value: 8
    rhs:
      kind: ref
      field: payloadBits
    doc: Length counts bytes; payloadBits = length × 8.
