# yaml-language-server: $schema=../../schemas/psdl.schema.json
name: Ethernet II + 802.1Q VLAN Tag
rowBits: 32
byteOrder: Network byte order (big-endian, MSB-first). The TCI (PCP/DEI/VID) is packed into a single 16-bit big-endian field after TPID.
description: "Ethernet II frame header with an inserted 802.1Q VLAN tag (IEEE 802.1Q-2018). 18-byte header: a 4-byte tag (TPID + TCI) sits between Source MAC and the original EtherType. With Q-in-Q (IEEE 802.1ad) double tagging, the outer tag uses TPID 0x88A8 (S-TAG) and is followed by an inner 0x8100 C-TAG before the EtherType — modeled here as an optional inner tag gated on the (non-zero) outer TPID, so the default single-tag layout stays 144 bits."
body:
  - id: dstMac
    name: Destination MAC
    type:
      kind: bits
      n: 48
    category: addressing
    doc: 48-bit destination MAC — same role as in a plain Ethernet frame. The VLAN tag does not change addressing, only the broadcast domain on the switch.
  - id: srcMac
    name: Source MAC
    type:
      kind: bits
      n: 48
    category: addressing
    doc: 48-bit sender MAC. Switches learn it per-VLAN, so the same MAC can theoretically be reused in different VLANs.
  - id: tpid
    name: TPID
    type:
      kind: bits
      n: 16
    category: type
    doc: Tag Protocol Identifier — the magic value that announces a VLAN tag is present. 0x8100 for a single 802.1Q tag; 0x88A8 marks an outer 802.1ad (Q-in-Q / provider) S-TAG, in which case an inner 0x8100 C-TAG follows before the EtherType. PSDL has no comparison operator, so the inner C-TAG below is gated on this TPID being non-zero rather than on the literal 0x88A8. [IEEE 802.1Q, 802.1ad]
  - id: pcp
    name: PCP
    type:
      kind: bits
      n: 3
    category: type
    doc: Priority Code Point — 3-bit IEEE 802.1p class-of-service (0–7) that switches use to pick output queues. e.g. 5 for voice, 6 for video, 0 for best-effort.
  - id: dei
    name: DEI
    type:
      kind: bits
      n: 1
    category: flags
    doc: Drop Eligible Indicator — when set, marks the frame as a candidate to drop first during congestion. Formerly CFI in legacy 802.1Q.
  - id: vid
    name: VLAN ID
    type:
      kind: bits
      n: 12
    category: identifier
    doc: 12-bit VLAN identifier (0–4095) — selects the virtual LAN this frame belongs to. 0=priority-tagged only (no VLAN), 1=default VLAN, 4095=reserved. In a Q-in-Q S-TAG this is the provider/service VLAN (S-VID).
  - kind: optional
    when: { kind: ref, field: tpid }
    field:
      id: innerTpid
      name: Inner TPID
      type:
        kind: bits
        n: 16
      category: type
      doc: Q-in-Q inner Tag Protocol Identifier — present only when the outer TPID indicates an 802.1ad S-TAG (0x88A8). Normally 0x8100, identifying the inner 802.1Q customer C-TAG. [IEEE 802.1ad]
  - kind: optional
    when: { kind: ref, field: tpid }
    field:
      id: innerPcp
      name: Inner PCP
      type:
        kind: bits
        n: 3
      category: type
      doc: Q-in-Q inner Priority Code Point — 3-bit 802.1p class-of-service of the customer C-TAG, independent of the outer S-TAG PCP. Present only under double tagging. [IEEE 802.1ad / 802.1Q]
  - kind: optional
    when: { kind: ref, field: tpid }
    field:
      id: innerDei
      name: Inner DEI
      type:
        kind: bits
        n: 1
      category: flags
      doc: Q-in-Q inner Drop Eligible Indicator of the customer C-TAG. Present only under double tagging. [IEEE 802.1ad]
  - kind: optional
    when: { kind: ref, field: tpid }
    field:
      id: innerVid
      name: Inner VLAN ID
      type:
        kind: bits
        n: 12
      category: identifier
      doc: Q-in-Q inner 12-bit VLAN identifier (C-VID) — the customer VLAN carried inside the provider's S-VLAN. Present only under double tagging; lets the same C-VID coexist across customers. [IEEE 802.1ad]
  - id: etherType
    name: EtherType
    type:
      kind: bits
      n: 16
    category: type
    doc: EtherType of the payload after the VLAN tag — the same field that would have appeared in an untagged frame. e.g. 0x0800=IPv4, 0x86DD=IPv6, 0x0806=ARP.
