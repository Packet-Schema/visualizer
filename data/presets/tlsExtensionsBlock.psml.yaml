# yaml-language-server: $schema=../../schemas/psml.schema.json
name: TLS Extensions Block
rowBits: 32
byteOrder: BE
description: TLS 1.3 extensions block (RFC 8446 §4.2) modeled as a Repeat<Switch> where the Switch discriminator is a peek(16) of the extension_type word. The peek is non-consuming so each case re-reads the same 16-bit field as its first member. Demonstrates the PSML 0.4 lookahead Switch.
body:
  - kind: repeat
    id: extensions
    name: Extensions
    category: variable
    element:
      id: extensionRecord
      fields:
        - kind: switch
          id: byPeekedType
          on:
            kind: peek
            bits: 16
          cases:
            "0":
              id: sniExt
              fields:
                - id: extensionType
                  name: extension_type=0
                  type:
                    kind: bits
                    n: 16
                  category: type
                - id: serverNameListLength
                  name: server_name_list length
                  type:
                    kind: bits
                    n: 16
                  category: length
                - id: serverNameList
                  name: server_name_list
                  type:
                    kind: bytes
                    n:
                      kind: ref
                      field: serverNameListLength
                  category: addressing
            "16":
              id: alpnExt
              fields:
                - id: extensionType
                  name: extension_type=16
                  type:
                    kind: bits
                    n: 16
                  category: type
                - id: protocolNameListLength
                  name: protocol_name_list length
                  type:
                    kind: bits
                    n: 16
                  category: length
                - id: alpnProtocols
                  name: alpn_protocols
                  type:
                    kind: bytes
                    n:
                      kind: ref
                      field: protocolNameListLength
                  category: type
            "43":
              id: supportedVersionsExt
              fields:
                - id: extensionType
                  name: extension_type=43
                  type:
                    kind: bits
                    n: 16
                  category: type
                - id: supportedVersionsLength
                  name: SupportedVersions length
                  type:
                    kind: bits
                    n: 8
                  category: length
                - id: versions
                  name: versions
                  type:
                    kind: bytes
                    n:
                      kind: ref
                      field: supportedVersionsLength
                  category: type
            "51":
              id: keyShareExt
              fields:
                - id: extensionType
                  name: extension_type=51
                  type:
                    kind: bits
                    n: 16
                  category: type
                - id: clientSharesLength
                  name: client_shares length
                  type:
                    kind: bits
                    n: 16
                  category: length
                - id: keyShareEntry
                  name: KeyShareEntry
                  type:
                    kind: bytes
                    n:
                      kind: ref
                      field: clientSharesLength
                  category: identifier
    count:
      kind: ref
      field: tlsExtensionsBlock_extensions_count
