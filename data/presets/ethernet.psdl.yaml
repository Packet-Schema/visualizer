# yaml-language-server: $schema=../../schemas/psdl.schema.json
name: Ethernet II Frame Header
rowBits: 32
byteOrder: BE
description: Ethernet II frame header — 14 bytes.
body:
  - { id: dstMac, name: Destination MAC, type: { kind: bits, n: 48 }, category: addressing, doc: "Destination MAC address (IEEE 802.3 clause 3.2.5 / 3.3). 48-bit identifier; broadcast = ff:ff:ff:ff:ff:ff." }
  - { id: srcMac, name: Source MAC, type: { kind: bits, n: 48 }, category: addressing, doc: "Source MAC address (IEEE 802.3 clause 3.2.6 / 3.3). Unicast address of the transmitting station." }
  - id: etherType
    name: EtherType / Length
    type:
      kind: enum
      bits: 16
      variants:
        2048: IPv4 (0x0800)
        2054: ARP (0x0806)
        33024: VLAN-tagged 802.1Q (0x8100)
        34525: IPv6 (0x86DD)
        34887: MPLS unicast (0x8847)
    category: type
    doc: >-
      EtherType/Length field (IEEE 802.3 clause 3.2.6). Per IEEE 802.3a the same
      16-bit field is interpreted two ways: when the value is < 1536 (0x0600) it
      is the IEEE 802.3 frame *length* in octets and the payload begins with an
      802.2 LLC header (DSAP, SSAP, Control — IEEE 802.2; optionally followed by
      a SNAP header: 3-octet OUI + 2-octet protocol id, RFC 1042). When the value
      is >= 1536 (0x0600) it is an Ethernet II EtherType identifying the next
      layer protocol, e.g. 0x0800 IPv4 (RFC 894), 0x0806 ARP (RFC 826),
      0x86DD IPv6 (RFC 2464), 0x8100 IEEE 802.1Q VLAN tag, 0x8847 MPLS (RFC 3032).
