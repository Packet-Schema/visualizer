# yaml-language-server: $schema=../../schemas/psdl.schema.json
name: QUIC Short Header (1-RTT)
rowBits: 32
byteOrder: BE
description: QUIC v1 short-header (1-RTT) packet (RFC 9000 §17.3). Connection ID length is negotiated out-of-band; this preset assumes an 8-byte Destination CID for illustration and wraps the header-protected and AEAD-protected regions in Encrypted containers.
body:
  - id: headerForm
    name: Header Form (0=Short)
    type:
      kind: bits
      n: 1
    category: type
    doc: 0 = short header (1-RTT). [RFC 9000 §17.3]
  - id: fixedBit
    name: Fixed Bit
    type:
      kind: bits
      n: 1
    category: reserved
    doc: Must be 1 in QUIC v1. [RFC 9000 §17.2]
  - id: spinBit
    name: Spin Bit
    type:
      kind: bits
      n: 1
    category: flags
    doc: Latency spin bit — toggled once per RTT for passive on-path RTT measurement. [RFC 9000 §17.4]
  - id: reserved
    name: Reserved
    type:
      kind: bits
      n: 2
    category: reserved
    doc: Reserved bits — protected by header protection on the wire; must decrypt to 0. [RFC 9000 §17.3.1]
  - id: keyPhase
    name: Key Phase
    type:
      kind: bits
      n: 1
    category: flags
    doc: Identifies which set of packet-protection keys is in use; flips on key update. [RFC 9000 §6]
  - id: dcid
    name: Destination Connection ID
    type:
      kind: bits
      n: 64
    category: addressing
    doc: Receiver-chosen Connection ID — length is negotiated out-of-band (0–20 bytes); shown here as 8 bytes.
  - kind: encrypted
    id: pnArea
    name: Header-protected PN area
    contextNote: Header protection mask (XOR) derived from the AEAD sample using the hp key — required before reading these bits.
    headerProtected:
      - pnLen
      - packetNumber
    category: identifier
    plaintext:
      id: pnAreaPlaintext
      fields:
        - id: pnLen
          name: Packet Number Length
          type:
            kind: bits
            n: 2
          category: length
          doc: Encoded length of the Packet Number field minus 1 (1–4 bytes). Header-protected. [RFC 9000 §17.3.1]
        - id: packetNumber
          name: Packet Number
          type:
            kind: bits
            n: 8
          category: identifier
          doc: Truncated packet number — header-protected on the wire. 1–4 bytes wide. [RFC 9000 §17.1]
  - kind: encrypted
    id: payload
    name: Encrypted Payload
    contextNote: AEAD-protected QUIC frames — requires TLS 1.3 handshake outputs (1-RTT keys) to decrypt.
    wireBits:
      kind: lit
      value: 128
    category: payload-marker
    plaintext:
      id: frames
      fields:
        - id: frameType
          name: Frame Type
          type:
            kind: bits
            n: 8
          category: type
          defaultValue: 8
        - kind: switch
          id: frameByType
          on:
            kind: ref
            field: frameType
          cases:
            "0":
              id: paddingFrame
              fields:
                - id: padding_body
                  name: PADDING
                  type:
                    kind: bits
                    n: 8
                  category: reserved
                  doc: PADDING frame — a single zero byte with no body; increases packet size. [RFC 9000 §19.1]
            "1":
              id: pingFrame
              fields: []
            "2":
              id: ackFrame
              fields:
                - id: ack_body
                  name: ACK Ranges
                  type:
                    kind: bits
                    n: 128
                  category: payload-marker
                  doc: ACK frame ranges (RFC 9000 §19.3). 16-byte placeholder.
            "4":
              id: resetStreamFrame
              fields:
                - id: rs_streamId
                  name: Stream ID
                  type:
                    kind: bits
                    n: 32
                  category: identifier
                  doc: Stream ID of the stream being terminated. [RFC 9000 §19.4]
                - id: rs_appErrorCode
                  name: Application Error Code
                  type:
                    kind: bits
                    n: 32
                  category: type
                  doc: Application-level error code indicating why the stream is closed. [RFC 9000 §19.4]
                - id: rs_finalSize
                  name: Final Size
                  type:
                    kind: bits
                    n: 32
                  category: length
                  doc: Final size (in bytes) of the stream by the RESET_STREAM sender. [RFC 9000 §19.4]
            "5":
              id: stopSendingFrame
              fields:
                - id: ss_streamId
                  name: Stream ID
                  type:
                    kind: bits
                    n: 32
                  category: identifier
                  doc: Stream ID of the stream being ignored. [RFC 9000 §19.5]
                - id: ss_appErrorCode
                  name: Application Error Code
                  type:
                    kind: bits
                    n: 32
                  category: type
                  doc: Application-level error code indicating why the sender is ignoring the stream. [RFC 9000 §19.5]
            "7":
              id: newTokenFrame
              fields:
                - id: nt_tokenLength
                  name: Token Length
                  type:
                    kind: bits
                    n: 8
                  category: length
                  doc: Length of the Token field, as a variable-length integer (placeholder). [RFC 9000 §19.7]
                - id: nt_token
                  name: Token
                  type:
                    kind: bits
                    n: 64
                  category: payload-marker
                  doc: Opaque token a client can use in the header of a future Initial packet. [RFC 9000 §19.7]
            "6":
              id: cryptoFrame
              fields:
                - id: crypto_body
                  name: CRYPTO Data
                  type:
                    kind: bits
                    n: 128
                  category: payload-marker
                  doc: CRYPTO frame data (RFC 9000 §19.6). 16-byte placeholder.
            "8":
              id: streamFrame
              fields:
                - id: stream_body
                  name: Stream Data
                  type:
                    kind: bits
                    n: 128
                  category: payload-marker
                  doc: STREAM frame payload (RFC 9000 §19.8). 16-byte placeholder.
            "16":
              id: maxDataFrame
              fields:
                - id: md_maximumData
                  name: Maximum Data
                  type:
                    kind: bits
                    n: 32
                  category: length
                  doc: Maximum amount of data (in bytes) that can be sent on the connection, as a variable-length integer (placeholder). [RFC 9000 §19.9]
            "24":
              id: newConnectionIdFrame
              fields:
                - id: ncid_sequenceNumber
                  name: Sequence Number
                  type:
                    kind: bits
                    n: 8
                  category: identifier
                  doc: Sequence number assigned to the Connection ID, as a variable-length integer (placeholder). [RFC 9000 §19.15]
                - id: ncid_retirePriorTo
                  name: Retire Prior To
                  type:
                    kind: bits
                    n: 8
                  category: identifier
                  doc: The smallest sequence number to keep; prior Connection IDs should be retired. [RFC 9000 §19.15]
                - id: ncid_length
                  name: Length
                  type:
                    kind: bits
                    n: 8
                  category: length
                  doc: Length of the Connection ID field (1–20 bytes). [RFC 9000 §19.15]
                - id: ncid_connectionId
                  name: Connection ID
                  type:
                    kind: bits
                    n: 64
                  category: addressing
                  doc: New Connection ID the peer may use; shown here as 8 bytes. [RFC 9000 §19.15]
                - id: ncid_statelessResetToken
                  name: Stateless Reset Token
                  type:
                    kind: bits
                    n: 128
                  category: checksum
                  doc: 128-bit Stateless Reset Token associated with the Connection ID. [RFC 9000 §19.15]
            "26":
              id: pathChallengeFrame
              fields:
                - id: pc_data
                  name: Data
                  type:
                    kind: bits
                    n: 64
                  category: payload-marker
                  doc: 64-bit unpredictable payload used to validate the path to the peer. [RFC 9000 §19.17]
            "27":
              id: pathResponseFrame
              fields:
                - id: pr_data
                  name: Data
                  type:
                    kind: bits
                    n: 64
                  category: payload-marker
                  doc: 64-bit payload echoing the Data of a received PATH_CHALLENGE frame. [RFC 9000 §19.18]
            "28":
              id: connectionCloseTransportFrame
              fields:
                - id: cct_errorCode
                  name: Error Code
                  type:
                    kind: bits
                    n: 32
                  category: type
                  doc: A QUIC transport error code indicating the reason for closing, as a variable-length integer (placeholder). [RFC 9000 §19.19]
                - id: cct_frameType
                  name: Frame Type
                  type:
                    kind: bits
                    n: 8
                  category: type
                  doc: Type of the frame that triggered the error (0 when unknown), as a variable-length integer (placeholder). [RFC 9000 §19.19]
                - id: cct_reasonPhraseLength
                  name: Reason Phrase Length
                  type:
                    kind: bits
                    n: 8
                  category: length
                  doc: Length of the Reason Phrase field, as a variable-length integer (placeholder). [RFC 9000 §19.19]
                - id: cct_reasonPhrase
                  name: Reason Phrase
                  type:
                    kind: bits
                    n: 32
                  category: payload-marker
                  doc: UTF-8 encoded human-readable explanation for closing the connection. [RFC 9000 §19.19]
            "29":
              id: connectionCloseApplicationFrame
              fields:
                - id: cca_errorCode
                  name: Error Code
                  type:
                    kind: bits
                    n: 32
                  category: type
                  doc: An application protocol error code indicating the reason for closing, as a variable-length integer (placeholder). [RFC 9000 §19.19]
                - id: cca_reasonPhraseLength
                  name: Reason Phrase Length
                  type:
                    kind: bits
                    n: 8
                  category: length
                  doc: Length of the Reason Phrase field, as a variable-length integer (placeholder). [RFC 9000 §19.19]
                - id: cca_reasonPhrase
                  name: Reason Phrase
                  type:
                    kind: bits
                    n: 32
                  category: payload-marker
                  doc: UTF-8 encoded human-readable explanation for closing the connection. [RFC 9000 §19.19]
            "30":
              id: handshakeDoneFrame
              fields: []
          default:
            id: frameDefault
            fields:
              - id: frame_body
                name: Frame Payload
                type:
                  kind: bits
                  n: 128
                category: payload-marker
                doc: Unknown frame type — placeholder body.
