name: validate-presets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-presets.yml"
      - "data/presets/**"
      - "web/scripts/build-presets.ts"
  pull_request:
    paths:
      - ".github/workflows/validate-presets.yml"
      - "data/presets/**"
      - "web/scripts/build-presets.ts"

concurrency:
  group: validate-presets-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # build-presets.ts は data/presets/*.psml.yaml を 1 件ずつ Ajv で検証し、
      # 失敗ファイル名と instancePath を stderr に出します。GitHub Actions の
      # UI からどの YAML のどこが schema 違反かが直接読めます。
      - name: Validate PSML presets
        run: npx tsx scripts/build-presets.ts
