name: test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test.yml"
      - "web/**"
      - "data/presets/**"
      - "schemas/**"
  pull_request:
    paths:
      - ".github/workflows/test.yml"
      - "web/**"
      - "data/presets/**"
      - "schemas/**"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      - run: npm run test:coverage

      - run: npm run test:integration

      - run: |
          # Wait for port 8787 to be released
          max_attempts=30
          attempt=0
          while lsof -i :8787 > /dev/null 2>&1 && [ $attempt -lt $max_attempts ]; do
            echo "Port 8787 still in use, waiting... ($((attempt+1))/$max_attempts)"
            sleep 1
            attempt=$((attempt+1))
          done

          if lsof -i :8787 > /dev/null 2>&1; then
            echo "Port 8787 still in use after $max_attempts seconds, forcing cleanup"
            lsof -ti :8787 | xargs kill -9 2>/dev/null || true
            sleep 2
          fi

          echo "Port 8787 is now available"

      - run: npx playwright install

      - run: npm run test:e2e
