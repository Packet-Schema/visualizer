name: prettier

on:
  pull_request:

concurrency:
  group: prettier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prettier:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run format
        working-directory: web

      - name: Commit and push Prettier fixes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Prettier auto-fixes"
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.event.pull_request.head.ref }}" && \
              git push origin HEAD:"${{ github.event.pull_request.head.ref }}" && exit 0
            sleep 2
          done
          echo "Failed to push after retries due to branch updates."
          exit 1
