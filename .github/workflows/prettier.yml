name: prettier

on:
  pull_request:

concurrency:
  group: prettier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prettier:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - id: format_check
        run: npm run format:check
        working-directory: web
        continue-on-error: true

      - if: steps.format_check.outcome == 'failure'
        run: npm run format
        working-directory: web

      - id: format_comment
        name: Build formatting review body
        if: steps.format_check.outcome == 'failure'
        run: |
          comment_file="$(mktemp)"
          files_file="$(mktemp)"
          git diff --name-only -- web > "$files_file"
          file_count="$(wc -l < "$files_file" | tr -d ' ')"

          {
            echo "<!-- prettier-format-diff -->"
            echo "## Prettier Review"
            echo
            echo "| status | rule | files |"
            echo "| --- | --- | ---: |"
            echo "| formatting required | \`npm run format:check\` | $file_count |"
            echo
            echo "Prettier の整形差分があります。`web` で `npm run format` を実行すると解消できます。"
            echo
            echo "---"
            echo
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              echo "### \`$file\`"
              echo
              echo "**prettier/format**"
              echo
              echo "このファイルは Prettier の期待する整形結果と差分があります。"
              echo
              echo "\`\`\`text"
              echo "cd web"
              echo "npm run format"
              echo "\`\`\`"
              echo
              echo "<details>"
              echo "<summary>整形差分を表示</summary>"
              echo
              echo '```diff'
              git diff --unified=1 -- "$file" | sed -n '1,160p'
              echo '```'
              echo
              echo "</details>"
              echo
            done < "$files_file"
            echo "_コメントの肥大化を避けるため、diff はファイルごとに先頭 160 行まで掲載しています。_"
          } > "$comment_file"

          delimiter="PRETTIER_COMMENT_$(date +%s%N)"
          {
            echo "body<<$delimiter"
            cat "$comment_file"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Review PR with formatting diff
        if: steps.format_check.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          FORMAT_COMMENT_BODY: ${{ steps.format_comment.outputs.body }}
        with:
          script: |
            const marker = "<!-- prettier-format-diff -->";
            const body = process.env.FORMAT_COMMENT_BODY?.trim() || [
              marker,
              "## Prettier Review",
              "",
              "Prettier チェックが失敗しましたが、レビューコメントの生成に失敗しました。",
            ].join("\n");

            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull_number,
              per_page: 100,
            });
            const legacyComments = comments.filter((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );
            for (const comment of legacyComments) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: comment.id,
              });
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            const existingReview = [...reviews]
              .reverse()
              .find((review) =>
                review.user?.type === "Bot" &&
                review.body?.includes(marker)
              );

            if (existingReview) {
              await github.rest.pulls.updateReview({
                owner,
                repo,
                pull_number,
                review_id: existingReview.id,
                body,
              });
            } else {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number,
                body,
                event: "COMMENT",
              });
            }

      - name: Resolve stale formatting review
        if: steps.format_check.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- prettier-format-diff -->";
            const body = [
              marker,
              "## Prettier Review",
              "",
              "Prettier の整形差分は解消されています。",
            ].join("\n");

            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull_number,
              per_page: 100,
            });
            const legacyComments = comments.filter((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );
            for (const comment of legacyComments) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: comment.id,
              });
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            const existingReview = [...reviews]
              .reverse()
              .find((review) =>
                review.user?.type === "Bot" &&
                review.body?.includes(marker)
              );

            if (existingReview) {
              await github.rest.pulls.updateReview({
                owner,
                repo,
                pull_number,
                review_id: existingReview.id,
                body,
              });
            }

      - if: steps.format_check.outcome == 'failure'
        run: exit 1
